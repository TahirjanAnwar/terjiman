# Builds Terjiman.exe (Windows) and the two Mac .dmg files (Apple Silicon, Intel) for a release.
# Push a tag like v1.2.0, or "Run workflow" with a release tag: the files go into a DRAFT release, which is checked
# and then published by hand. "Run workflow" without a tag only builds the files (see the run's artifacts).
name: Build Terjiman

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Tag for a draft release, like v1.2.0 (empty: only build the files)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Checks
        run: python tools/check_engine.py --offline
      - name: Build Terjiman.exe
        run: python -m PyInstaller terjiman.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: Terjiman-windows
          path: dist/Terjiman.exe

  mac:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11 from python.org (Intel and Apple Silicon, runs on macOS 10.9+)
        run: |
          curl -fsSLo python.pkg https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg python.pkg -target /
      - name: Rosetta, for the Intel build
        if: matrix.arch == 'x86_64'
        run: sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - name: Build Terjiman.app and the .dmg
        run: bash tools/build_mac.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Terjiman-mac-${{ matrix.arch }}
          path: |
            dist-${{ matrix.arch }}/*.dmg
            dist-${{ matrix.arch }}/screenshots/

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft release with the downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Terjiman ${TAG#v}" \
            --notes-file docs/release-notes.md \
            artifacts/Terjiman-windows/Terjiman.exe \
            artifacts/Terjiman-mac-arm64/*.dmg \
            artifacts/Terjiman-mac-x86_64/*.dmg
